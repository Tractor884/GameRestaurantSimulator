# Симулятор ресторана — сайт + API рейтинга.
# Копия этого файла: /etc/nginx/conf.d/restsim.conf (заменяет старый конфиг игры)
# После копирования: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8080;
    server_name _;

    # Файлы игры (index.html и всё остальное из архива)
    root /var/www/restsim;
    index index.html;

    # API общего рейтинга → мини-сервис Node (порт 3001, только локально).
    # Игра обращается по относительному пути /api/leaderboard — код игры
    # при этом не меняется.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Папка сервиса и его база рейтинга — из веба недоступны
    location ^~ /server/ {
        return 404;
    }

    # Файлы Next.js со хэшем в имени можно кэшировать надолго
    location /_next/static/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Главная страница — всегда свежая (после обновлений игры)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
